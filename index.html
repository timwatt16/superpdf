<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Super PDF</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Super PDF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<script>window.SUPERPDF_PACKED=true;if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script>
<link rel="stylesheet" href="app.css">
<script src="pdf-lib.min.js"></script>
<script src="Sortable.min.js"></script>
<script src="pako.min.js"></script>
<script src="UTIF.js"></script>
<script src="tiffenc.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H7.5a2 2 0 0 0-1.9 1.4L3 19V7z"/><path d="M5.6 11.4A2 2 0 0 1 7.5 10H22l-2.6 8.1a2 2 0 0 1-1.9 1.4H3l2.6-8.1z"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></symbol>
    <symbol id="i-blank" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-rl" viewBox="0 0 24 24"><path d="M3 4v5h5"/><path d="M3.5 9A9 9 0 1 1 5 16"/></symbol>
    <symbol id="i-rr" viewBox="0 0 24 24"><path d="M21 4v5h-5"/><path d="M20.5 9A9 9 0 1 0 19 16"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8M7 21v-7h10v7"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/></symbol>
    <symbol id="i-read" viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></symbol>
    <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></symbol>
    <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-extract" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 15l3 3 3-3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.1 16 18 4M15.9 16 6 4"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M15 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/><path d="M12 2v20" stroke-dasharray="2 2"/></symbol>
    <symbol id="i-convert" viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></symbol>
    <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h9M14 11v7M10.5 14.5h7"/></symbol>
    <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></symbol>
    <symbol id="i-word" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7 8 2 8 3-6 3 6 2-8"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M5 11h14M5 16h9"/></symbol>
    <symbol id="i-tab" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M9 5v4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-selall" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 2.5"/><path d="m8 12 3 3 5-6"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand"><img src="icon.svg" alt=""><span>Super <b>PDF</b></span></div>

  <div class="tgroup">
    <button id="btnOpen" class="tbtn" title="เปิดไฟล์ใหม่ (Ctrl+O)"><svg><use href="#i-open"/></svg><span>เปิดไฟล์</span></button>
    <button id="btnAdd" class="tbtn" title="เพิ่ม/แทรกไฟล์ต่อจากหน้าที่เลือก"><svg><use href="#i-add"/></svg><span>เพิ่มไฟล์</span></button>
    <button id="btnBlank" class="tbtn" title="แทรกหน้าว่างต่อจากหน้าที่เลือก"><svg><use href="#i-blank"/></svg><span>หน้าว่าง</span></button>
  </div>

  <div class="seg" role="tablist">
    <button id="viewOrganize" class="segbtn active" title="จัดการหน้า"><svg><use href="#i-grid"/></svg><span>จัดการหน้า</span></button>
    <button id="viewRead" class="segbtn" title="อ่าน PDF"><svg><use href="#i-read"/></svg><span>อ่าน</span></button>
  </div>

  <div class="tgroup only-organize">
    <button id="btnCopy" class="tbtn icon" title="คัดลอกหน้าที่เลือก (Ctrl+C)"><svg><use href="#i-copy"/></svg></button>
    <button id="btnCut" class="tbtn icon" title="ตัดหน้าที่เลือก (Ctrl+X)"><svg><use href="#i-cut"/></svg></button>
    <button id="btnPaste" class="tbtn icon" title="วาง — หน้าที่คัดลอก หรือไฟล์/รูป/ข้อความจากแอปอื่น (Ctrl+V)"><svg><use href="#i-paste"/></svg></button>
    <span class="sep"></span>
    <button id="btnRotL" class="tbtn icon" title="หมุนซ้าย 90°"><svg><use href="#i-rl"/></svg></button>
    <button id="btnRotR" class="tbtn icon" title="หมุนขวา 90°"><svg><use href="#i-rr"/></svg></button>
    <button id="btnDelete" class="tbtn icon danger" title="ลบหน้าที่เลือก (Delete)"><svg><use href="#i-trash"/></svg></button>
    <span class="sep"></span>
    <button id="btnUndo" class="tbtn icon" title="เลิกทำ (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
    <button id="btnRedo" class="tbtn icon" title="ทำซ้ำ (Ctrl+Y)"><svg><use href="#i-redo"/></svg></button>
  </div>

  <div class="tgroup only-read">
    <button id="btnZoomOut" class="tbtn icon" title="ย่อ (Ctrl+-)"><svg><use href="#i-zout"/></svg></button>
    <span id="zoomLabel" class="zoomlabel">100%</span>
    <button id="btnZoomIn" class="tbtn icon" title="ขยาย (Ctrl++)"><svg><use href="#i-zin"/></svg></button>
    <button id="btnFit" class="tbtn icon" title="พอดีความกว้าง"><svg><use href="#i-fit"/></svg></button>
    <span class="sep"></span>
    <span class="pagego">หน้า <input id="pageInput" type="number" min="1" value="1"> / <span id="pageTotal">0</span></span>
  </div>

  <div class="spacer"></div>
  <button id="btnSplit" class="tbtn" title="แยกหน้าที่เลือกออกเป็นไฟล์/แท็บใหม่"><svg><use href="#i-split"/></svg><span>แยกไฟล์</span><svg class="dd"><use href="#i-down"/></svg></button>
  <button id="btnConvert" class="tbtn" title="แปลงหน้าที่เลือกเป็นรูปภาพ / Word / ข้อความ"><svg><use href="#i-convert"/></svg><span>แปลงไฟล์</span><svg class="dd"><use href="#i-down"/></svg></button>
  <div class="savegrp"><button id="btnSave" class="tbtn primary" title="บันทึก (Ctrl+S)"><svg><use href="#i-save"/></svg><span>บันทึก PDF</span></button><button id="btnSaveMenu" class="tbtn primary icon" title="ตัวเลือกการบันทึก"><svg><use href="#i-down"/></svg></button></div>
</header>

<nav id="tabbar" class="tabbar"><div id="tabs" class="tabs"></div><button id="btnNewTab" class="newtab" title="แท็บใหม่ (Ctrl+T)"><svg><use href="#i-plus"/></svg></button></nav>
<div id="annbar" class="annbar hidden">
  <button id="annTool" class="tbtn" title="เพิ่มข้อความ: คลิกบนหน้าเพื่อวางกล่องข้อความ (T)"><svg><use href="#i-type"/></svg><span>เพิ่มข้อความ</span></button>
  <span class="sep"></span>
  <select id="annFont" class="annsel" title="แบบอักษร"></select>
  <div class="sizebox"><button id="annSizeDn" class="tbtn icon" title="ลดขนาด">−</button><input id="annSize" type="number" min="4" max="300" value="16" title="ขนาดตัวอักษร (pt)"><button id="annSizeUp" class="tbtn icon" title="เพิ่มขนาด">+</button></div>
  <button id="annBold" class="tbtn icon fmt" title="ตัวหนา"><b>B</b></button>
  <button id="annItalic" class="tbtn icon fmt" title="ตัวเอียง"><i style="font-family:Georgia,serif">I</i></button>
  <label class="colorpick" title="สีตัวอักษร"><input id="annColor" type="color" value="#1f3a93"></label>
  <span class="swatches"><button class="swatch" data-c="#000000" style="background:#000"></button><button class="swatch" data-c="#1f3a93" style="background:#1f3a93"></button><button class="swatch" data-c="#d92d20" style="background:#d92d20"></button><button class="swatch" data-c="#067647" style="background:#067647"></button><button class="swatch" data-c="#7a2e0e" style="background:#7a2e0e"></button></span>
  <span class="sep"></span>
  <button id="annCopy" class="tbtn icon" title="คัดลอกกล่องข้อความ (Ctrl+C)"><svg><use href="#i-copy"/></svg></button>
  <button id="annCut" class="tbtn icon" title="ตัดกล่องข้อความ (Ctrl+X)"><svg><use href="#i-cut"/></svg></button>
  <button id="annPaste" class="tbtn icon" title="วางกล่องข้อความ (Ctrl+V)"><svg><use href="#i-paste"/></svg></button>
  <button id="annDup" class="tbtn icon" title="ทำสำเนา (Ctrl+D)"><svg><use href="#i-dup"/></svg></button>
  <button id="annDel" class="tbtn icon danger" title="ลบกล่องข้อความ (Delete)"><svg><use href="#i-trash"/></svg></button>
  <span class="sep"></span>
  <button id="annUndo" class="tbtn icon" title="เลิกทำ (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
  <button id="annRedo" class="tbtn icon" title="ทำซ้ำ (Ctrl+Y)"><svg><use href="#i-redo"/></svg></button>
  <span id="annHint" class="annhint"></span>
</div>

<main id="main">
  <section id="empty" class="empty">
    <div class="dropcard" id="dropcard">
      <div class="dropicon"><svg><use href="#i-add"/></svg></div>
      <h1>ลากไฟล์มาวางที่นี่</h1>
      <p>หรือ <button id="btnPick" class="linkbtn">คลิกเพื่อเลือกไฟล์</button> — เลือกได้หลายไฟล์พร้อมกัน</p>
      <p><button id="btnPastePick" class="pastebtn"><svg><use href="#i-paste"/></svg> วางจากคลิปบอร์ด (ไฟล์ / รูปภาพ / ข้อความ / ลิงก์)</button></p>
      <div class="chips">
        <span class="chip pdf">PDF</span>
        <span class="chip word">DOC</span><span class="chip word">DOCX</span><span class="chip word">RTF</span>
        <span class="chip excel">XLS</span><span class="chip excel">XLSX</span><span class="chip excel">CSV</span>
        <span class="chip ppt">PPT</span><span class="chip ppt">PPTX</span>
        <span class="chip img">JPG</span><span class="chip img">PNG</span><span class="chip img">TIFF</span><span class="chip img">BMP</span><span class="chip img">GIF</span><span class="chip img">WEBP</span>
      </div>
      <p class="hint" id="officeHint"></p>
    </div>
  </section>

  <section id="organize" class="organize hidden">
    <div id="grid" class="grid"></div>
  </section>

  <section id="reader" class="reader hidden">
    <div id="readerPages" class="readerpages"></div>
  </section>

  <div id="dropOverlay" class="dropoverlay hidden"><div>วางไฟล์เพื่อเพิ่มเข้าเอกสาร</div></div>
</main>

<footer class="statusbar">
  <span id="stDoc">ยังไม่มีเอกสาร</span>
  <span id="stSel"></span>
  <span class="spacer"></span>
  <label class="sizer only-organize" title="ขนาดภาพย่อ">ภาพย่อ <input id="thumbSize" type="range" min="110" max="320" value="170"></label>
  <label class="imgopt">รูปภาพ → PDF:
    <select id="imgMode">
      <option value="a4">พอดีกระดาษ A4</option>
      <option value="native">ขนาดตามรูปภาพ</option>
    </select>
  </label>
  <span id="stOffice" class="stoffice"></span>
</footer>

<input id="fileOpen" type="file" multiple hidden>
<input id="fileAdd" type="file" multiple hidden>

<div id="busy" class="busy hidden"><div class="busybox"><div class="spinner"></div><div id="busyText">กำลังทำงาน…</div></div></div>
<div id="toasts" class="toasts"></div>

<div id="modal" class="modal hidden">
  <form class="modalbox" id="modalForm" autocomplete="off" onsubmit="return false">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modalbtns" id="modalBtns"></div>
  </form>
</div>
<div id="marquee" class="marquee hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
